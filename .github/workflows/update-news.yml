name: Update news

on:
  schedule:
    # каждые 6 часов (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news
        run: python3 scripts/fetch_news.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.js
          if git diff --cached --quiet; then
            echo "Нет изменений в новостях."
          else
            git commit -m "Автообновление новостей (RSS)"
            git push
          fi
